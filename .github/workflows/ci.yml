name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Both shells, because the worst bug the deploy gate ever had was invisible in bash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh ffmpeg
      # shipprobe is the one dependency. Every deferless command forwards to it.
      - name: install
        run: npm ci
      # Playwright is an optional peer of shipprobe. The render --shots checks open a real page,
      # so it is installed here without being added to package.json.
      - name: install playwright
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: suite
        run: bash test/run.sh
      - name: demo is honest
        run: node bin/deferless.mjs demo
